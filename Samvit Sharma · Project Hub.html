<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samvit Sharma · Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ff;--surface:rgba(255,255,255,.7);--border:rgba(90,70,200,.16);--text:#16132b;--muted:#5d5a78;--a1:#6d4aff;--a2:#00b8d9;--a3:#ff5ca8;--shadow:0 10px 40px rgba(80,60,200,.14);--pc:109,74,255;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070612;--surface:rgba(26,23,52,.6);--border:rgba(160,150,255,.2);--text:#f1efff;--muted:#a19dc4;--shadow:0 12px 44px rgba(0,0,0,.55);--pc:150,130,255;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070612;--surface:rgba(26,23,52,.6);--border:rgba(160,150,255,.2);--text:#f1efff;--muted:#a19dc4;--shadow:0 12px 44px rgba(0,0,0,.55);--pc:150,130,255;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-2;width:100%;height:100%}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(100px);opacity:.3;animation:float 16s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a1);top:-15%;left:-10%}
.aurora i:nth-child(2){background:var(--a2);bottom:-20%;right:-10%;animation-delay:-6s}
.aurora i:nth-child(3){background:var(--a3);top:35%;left:45%;width:28vmax;height:28vmax;opacity:.2;animation-delay:-10s}
@keyframes float{to{transform:translate(7vmax,5vmax) scale(1.2)}}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--a1),var(--a3),var(--a2));z-index:50}
.wrap{max-width:1140px;margin:0 auto;padding:28px 20px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:700 14px 'Space Grotesk',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.live{display:inline-flex;align-items:center;gap:8px;font:500 12px Inter,sans-serif;letter-spacing:0;text-transform:none;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 12px;backdrop-filter:blur(12px)}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
.toggle{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 14px;font:500 13px Inter,sans-serif;cursor:pointer;backdrop-filter:blur(12px)}
.hero{text-align:center;padding:70px 0 30px}
.badge{display:inline-block;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(12px);border-radius:99px;padding:7px 18px;font-size:13px;color:var(--muted)}
h1{font:700 clamp(40px,9vw,96px)/1 'Space Grotesk',sans-serif;margin:24px 0 10px;letter-spacing:-.03em;background:linear-gradient(100deg,var(--a1),var(--a3),var(--a2),var(--a1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.type{font:500 clamp(15px,2.4vw,20px) 'Space Grotesk',sans-serif;color:var(--muted);min-height:1.6em}
.type::after{content:"|";margin-left:3px;color:var(--a3);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.meta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.chip{border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(12px);border-radius:16px;padding:11px 20px;font-size:15px;font-weight:600;animation:bob 5s ease-in-out infinite}
.chip:nth-child(2){animation-delay:-2.5s}
@keyframes bob{50%{transform:translateY(-6px)}}
.chip small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:38px 0 8px}
.stat{border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(14px);border-radius:18px;padding:16px;text-align:center}
.stat b{display:block;font:700 34px 'Space Grotesk',sans-serif;background:linear-gradient(100deg,var(--a1),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:34px 0 22px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.f{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:99px;padding:8px 16px;font:500 13px Inter,sans-serif;cursor:pointer;transition:.2s}
.f:hover{color:var(--text);transform:translateY(-2px)}
.f.on{background:linear-gradient(100deg,var(--a1),var(--a3));color:#fff;border-color:transparent}
.search{flex:1;min-width:200px;max-width:320px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:10px 18px;font:400 14px Inter,sans-serif;outline:none;backdrop-filter:blur(12px)}
.search:focus{border-color:var(--a1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;perspective:1000px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:24px;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(16px);box-shadow:var(--shadow);text-decoration:none;color:inherit;overflow:hidden;opacity:0;transform:translateY(30px) scale(.96);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1),border-color .3s}
.card.in{opacity:1;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0))}
.card.in.tilt{transition:transform .08s linear,border-color .3s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);transition:left .7s}
.card:hover{border-color:var(--c)}
.card:hover::before{opacity:1}
.card:hover::after{left:130%}
.card>*{position:relative;z-index:1}
.ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);animation:bob 4s ease-in-out infinite}
.card:hover .ico{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-12deg) scale(1.15)}75%{transform:rotate(12deg) scale(1.15)}}
.num{position:absolute;top:18px;right:22px;font:700 13px 'Space Grotesk',sans-serif;color:var(--muted);opacity:.7}
.card h3{margin:6px 0 0;font:700 21px 'Space Grotesk',sans-serif}
.card p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.tag{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:99px;padding:3px 10px}
.open{margin-top:auto;padding-top:10px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--c)}
.open span{margin-left:6px;transition:transform .25s}
.card:hover .open span{transform:translateX(6px)}
.copy{position:absolute;z-index:2;right:16px;bottom:16px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:10px;font:500 11px Inter,sans-serif;padding:5px 9px;cursor:pointer}
.copy:hover{color:var(--text)}
.empty{display:none;text-align:center;color:var(--muted);padding:40px}
footer{margin-top:60px;text-align:center;color:var(--muted);font-size:13px}
footer b{color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;transition:.3s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar"></div>
<canvas id="bg"></canvas>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="top">
    <div class="brand">Project Hub <span class="live"><span class="dot"></span><span id="clock">Live</span></span></div>
    <button class="toggle" id="theme" aria-label="Toggle theme">◐ Theme</button>
  </div>
  <header class="hero">
    <span class="badge">✦ Smart Greenhouse ML · Project Portfolio</span>
    <h1>SAMVIT SHARMA</h1>
    <div class="type" id="type"></div>
    <div class="meta">
      <div class="chip"><small>Roll No.</small>2410031112</div>
      <div class="chip"><small>University</small>IILM UNIVERSITY</div>
    </div>
  </header>
  <div class="stats">
    <div class="stat"><b data-n="9">0</b><span>Resources</span></div>
    <div class="stat"><b data-n="3">0</b><span>Data &amp; Code</span></div>
    <div class="stat"><b data-n="3">0</b><span>Documents</span></div>
    <div class="stat"><b data-n="2">0</b><span>Media</span></div>
  </div>
  <div class="tools">
    <div class="filters" id="filters">
      <button class="f on" data-f="all">All · 9</button>
      <button class="f" data-f="Data">Data &amp; Code</button>
      <button class="f" data-f="Present">Presentation</button>
      <button class="f" data-f="Docs">Documents</button>
      <button class="f" data-f="Media">Media</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search documents…" aria-label="Search documents">
  </div>
  <main class="grid" id="grid"></main>
  <div class="empty" id="empty">No documents match your search.</div>
  <footer>Crafted by <b>Samvit Sharma</b> · 2410031112 · IILM University</footer>
</div>
<div class="toast" id="toast">Link copied</div>
<script>
var items=[
{t:"Dataset",d:"The complete collection of data files used in this project.",g:"Data",l:"Folder",i:"🗂️",c:"#f59e0b",u:"https://drive.google.com/drive/folders/1hfIFPM8SJFXo4BpxrVTiUbsJd5zKriy4?usp=drive_link"},
{t:"IPYNB Notebook",d:"Jupyter notebook with the code, analysis and model workflow.",g:"Data",l:"Notebook",i:"📓",c:"#f97316",u:"https://drive.google.com/file/d/1z4kPEZXCCbu2pvPzGGXtMlOBIy_C3nHG/view?usp=drive_link"},
{t:"GitHub Repository",d:"Full source code of the Smart Greenhouse ML project.",g:"Data",l:"GitHub",i:"💻",c:"#64748b",u:"https://github.com/samvitsharmacs28-droid/Smart-greenhouse-ML/tree/main"},
{t:"Output",d:"Generated results, charts and final outputs of the project.",g:"Data",l:"Folder",i:"📊",c:"#10b981",u:"https://drive.google.com/drive/folders/1RMqLhvJYy9FZJiC0-o4Ms7rWfowVyVkY?usp=drive_link"},
{t:"Pitch Deck",d:"Slide presentation summarising the idea, approach and impact.",g:"Present",l:"Slides",i:"🎯",c:"#ef4444",u:"https://docs.google.com/presentation/d/1NUaa9Z4v50XZGkji9qW1T-Mg6Rgp0UR6/edit?usp=drive_link&ouid=109856870051276925497&rtpof=true&sd=true"},
{t:"Report",d:"Detailed written report covering the full project.",g:"Docs",l:"Document",i:"📝",c:"#3b82f6",u:"https://docs.google.com/document/d/1M4GMsb_m9FOTUwki7nFZp9U7SCjy5gh_/edit?usp=drive_link&ouid=109856870051276925497&rtpof=true&sd=true"},
{t:"Research Paper",d:"Academic paper with the background, method and findings.",g:"Docs",l:"PDF",i:"📚",c:"#8b5cf6",u:"https://drive.google.com/file/d/1RyCiNf0rZLeNY-l9RZaORV4wdEc00OG_/view?usp=drive_link"},
{t:"Leaflink",d:"Quick-access link resource attached to this project.",g:"Media",l:"Link",i:"🍃",c:"#22c55e",u:"https://drive.google.com/file/d/1_TZ0HgSnAGCTbD9DrTeOz4zTG-9WVCYR/view?usp=drive_link"},
{t:"Video",d:"Video walkthrough and demonstration of the project.",g:"Media",l:"Video",i:"🎬",c:"#ec4899",u:"https://drive.google.com/file/d/11icIwUsOMNwZC6HNWP6hX_9PE_rb7I4e/view?usp=drive_link"}
];
var grid=document.getElementById('grid'),empty=document.getElementById('empty'),toast=document.getElementById('toast');
var filter='all',query='';
function show(m){toast.textContent=m;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1600)}
items.forEach(function(x,n){
  var a=document.createElement('a');
  a.className='card';a.href=x.u;a.target='_blank';a.rel='noopener noreferrer';
  a.style.setProperty('--c',x.c);a.dataset.g=x.g;a.dataset.s=(x.t+' '+x.d+' '+x.l).toLowerCase();
  a.style.transitionDelay=(n*70)+'ms';
  a.innerHTML='<span class="num">0'+(n+1)+'</span><div class="ico">'+x.i+'</div><span class="tag">'+x.l+'</span><h3>'+x.t+'</h3><p>'+x.d+'</p><div class="open">Open <span>→</span></div>';
  var b=document.createElement('button');b.className='copy';b.textContent='Copy link';
  b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
    try{navigator.clipboard.writeText(x.u).then(function(){show('Link copied')},function(){show('Copy not allowed')})}catch(err){show('Copy not allowed')}});
  a.appendChild(b);
  a.addEventListener('pointermove',function(e){var r=a.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
    a.classList.add('tilt');a.style.transitionDelay='0ms';a.style.setProperty('--mx',(e.clientX-r.left)+'px');a.style.setProperty('--my',(e.clientY-r.top)+'px');a.style.setProperty('--rx',(-py*10)+'deg');a.style.setProperty('--ry',(px*12)+'deg')});
  a.addEventListener('pointerleave',function(){a.classList.remove('tilt');a.style.setProperty('--rx','0deg');a.style.setProperty('--ry','0deg')});
  grid.appendChild(a);
});
var cards=[].slice.call(grid.children);
function apply(){var n=0;cards.forEach(function(c){var ok=(filter==='all'||c.dataset.g===filter)&&c.dataset.s.indexOf(query)>-1;c.style.display=ok?'':'none';if(ok)n++});empty.style.display=n?'none':'block'}
document.getElementById('filters').addEventListener('click',function(e){var f=e.target.closest('.f');if(!f)return;[].forEach.call(document.querySelectorAll('.f'),function(x){x.classList.remove('on')});f.classList.add('on');filter=f.dataset.f;apply()});
document.getElementById('q').addEventListener('input',function(e){query=e.target.value.toLowerCase().trim();apply()});
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.08});cards.forEach(function(c){io.observe(c)})}else{cards.forEach(function(c){c.classList.add('in')})}
/* typewriter */
var words=['Machine Learning Project','Smart Greenhouse Monitoring','Data · Code · Research','All documents, one place'],wi=0,ci=0,del=false,te=document.getElementById('type');
(function tick(){var w=words[wi];ci+=del?-1:1;te.textContent=w.slice(0,ci);var d=del?35:75;
  if(!del&&ci===w.length){del=true;d=1400}else if(del&&ci===0){del=false;wi=(wi+1)%words.length;d=300}setTimeout(tick,d)})();
/* counters */
[].forEach.call(document.querySelectorAll('[data-n]'),function(el){var t=+el.dataset.n,s=null;
  function st(ts){if(!s)s=ts;var p=Math.min((ts-s)/1400,1);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)}requestAnimationFrame(st)});
/* live clock */
var ck=document.getElementById('clock');
function clock(){ck.textContent='Live · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}clock();setInterval(clock,1000);
/* scroll progress */
var bar=document.getElementById('bar');
addEventListener('scroll',function(){var h=document.documentElement;bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%'},{passive:true});
/* particle network */
var cv=document.getElementById('bg'),cx=cv.getContext('2d'),W,H,P=[],mouse={x:-999,y:-999};
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=[];var n=Math.min(90,Math.floor(W*H/16000));for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5})}
size();addEventListener('resize',size);
addEventListener('pointermove',function(e){mouse.x=e.clientX;mouse.y=e.clientY});
(function draw(){var rgb=getComputedStyle(document.documentElement).getPropertyValue('--pc').trim()||'109,74,255';cx.clearRect(0,0,W,H);
  for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    var dx=p.x-mouse.x,dy=p.y-mouse.y,md=Math.sqrt(dx*dx+dy*dy);if(md<140){p.x+=dx/md*1.2;p.y+=dy/md*1.2}
    cx.fillStyle='rgba('+rgb+',.7)';cx.beginPath();cx.arc(p.x,p.y,1.8,0,6.283);cx.fill();
    for(var j=i+1;j<P.length;j++){var q=P[j],ex=p.x-q.x,ey=p.y-q.y,d=ex*ex+ey*ey;if(d<14000){cx.strokeStyle='rgba('+rgb+','+(.28*(1-d/14000))+')';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}}
  requestAnimationFrame(draw)})();
/* theme */
var root=document.documentElement;
try{var s=localStorage.getItem('theme');if(s)root.setAttribute('data-theme',s)}catch(e){}
document.getElementById('theme').addEventListener('click',function(){
  var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  var n=dark?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}});
</script>
</body>
</html>
